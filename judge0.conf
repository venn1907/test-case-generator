# Local development defaults. Replace both passwords before exposing Judge0 publicly.
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=local_redis_8f2e5b9c

POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=local_postgres_7c4a1d6e

RAILS_ENV=production
RAILS_MAX_THREADS=8
RAILS_SERVER_PROCESSES=2
COUNT=2
MAX_QUEUE_SIZE=100

ENABLE_WAIT_RESULT=true
ENABLE_BATCHED_SUBMISSIONS=true
ALLOW_ENABLE_NETWORK=false
ENABLE_NETWORK=false
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=10
WALL_TIME_LIMIT=15
MAX_WALL_TIME_LIMIT=30
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=524288
# Judge0 CE 1.13.1 validates this default against a hard maximum of 4096 KB.
MAX_FILE_SIZE=1024
USE_DOCS_AS_HOMEPAGE=true
ALLOW_ORIGIN=
DISABLE_IMPLICIT_BASE64_ENCODING=false
