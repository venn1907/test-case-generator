services:
  app:
    image: testcasegenerator-app:latest
    build: .
    environment:
      PISTON_URL: http://piston:2000
      PORT: 3000
    ports:
      - "8080:3000"
    depends_on:
      piston-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # Piston supports the cgroup v2 kernel used by Docker Desktop on Windows.
  piston:
    image: ghcr.io/engineer-man/piston:latest
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    restart: unless-stopped

  piston-setup:
    image: testcasegenerator-app:latest
    environment:
      PISTON_URL: http://piston:2000
    command: ["node", "server/piston-setup.js"]
    depends_on:
      piston:
        condition: service_started
    restart: "no"

volumes:
  piston-packages:
